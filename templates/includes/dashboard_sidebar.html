<!-- ── Sidebar ── -->
<div class="col-md-3">
    <div class="card mb-2" style="border-radius:4px; overflow:hidden;">
        <div class="list-group list-group-flush">
            <a class="list-group-item {% if '/accounts/' == request.path %}active{% endif %}"
                href="{% url 'dashboard' %}"> Dashboard </a>
            <a class="list-group-item {% if '/my_orders/' in request.path %}active{% endif %}"
                href="{% url 'my_orders' %}"> My Orders </a>
            <a class="list-group-item {% if '/edit_profile/' in request.path %}active{% endif %}"
                href="{% url 'edit_profile' %}"> Edit Profile </a>
            <a class="list-group-item {% if '/change_password/' in request.path %}active{% endif %}"
                href="{% url 'change_password' %}"> Change Password </a>
        </div>
    </div>
    <a href="{% url 'logout' %}" class="btn btn-light btn-block"
        style="border:1px solid #ddd; padding:12px 20px; font-size:14px; color:#555; border-radius:4px; display:flex; align-items:center; justify-content:center; gap:8px;">
        &#9211; Log out
    </a>
</div>
<!-- sidebar end -->
