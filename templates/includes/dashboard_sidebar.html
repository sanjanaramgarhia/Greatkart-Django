    <div class="card mb-2" style="border-radius:4px; overflow:hidden;">

            <a class="list-group-item {% if '/accounts/' == request.path %}active{% endif %}"
                href="{% url 'dashboard' %}"> Dashboard </a>

            <a href="#" class="list-group-item list-group-item-action"

                style="padding:14px 20px; font-size:14px; color:#555;">
